name: Aprende Ingles
on:
  pull_request:
    paths:
      - 'src/InglesMusica*'
      - 'src/aprendeIngles.js'
      - 'tests/ingles*'
      - '.github/workflows/aprende-ingles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node tests/inglesUi.test.mjs
      - run: node tests/inglesSql.test.mjs
      - run: npx playwright-core install --with-deps chromium
      - name: Flujo de estudiante y docente
        run: |
          INGLES_TEST_CHROMIUM=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())") node tests/inglesBrowser.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test
